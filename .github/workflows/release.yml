name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 用 Windows runner，直接复用仓库自带的 python.exe 与 7z.exe，
    # 与本地 build_release.bat 构建出的产物完全一致。
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build installer
        shell: cmd
        run: python.exe tools\build_release.py

      - name: Read version tag
        id: tag
        shell: pwsh
        run: |
          $tag = (Get-Content -Raw release\tag.txt).Trim()
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version tag: $tag"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: mpv-lazy ${{ steps.tag.outputs.tag }}
          files: release\mpv-lazy-setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
